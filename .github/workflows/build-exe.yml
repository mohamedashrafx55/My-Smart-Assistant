name: Build Windows EXE

# يشتغل يدويًا فقط: Actions > Build Windows EXE > Run workflow
on:
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare web files
        run: |
          mkdir -p build/www
          tar --exclude=./.git --exclude=./.github --exclude=./build --exclude='*.md' --exclude='*.zip' -cf - . | (cd build/www && tar -xf -)
          test -f build/www/index.html
          sed -i "s/n: 0/n: ${RUN}/; s/platform: 'web'/platform: 'windows'/" build/www/js/buildinfo.js
          grep -n 'MSA.build' build/www/js/buildinfo.js
        env:
          RUN: ${{ github.run_number }}

      - name: Create desktop app files
        working-directory: build
        run: |
          cat > package.json <<'JSON'
          {
            "name": "my-smart-assistant",
            "version": "1.0.0",
            "description": "My Smart Assistant",
            "author": "Mohamed Ashraf",
            "main": "main.js",
            "build": {
              "appId": "com.mysmartassistant.app",
              "productName": "My Smart Assistant",
              "directories": { "output": "dist" },
              "files": ["main.js", "preload.js", "www/**/*"],
              "win": { "target": "nsis", "icon": "www/icons/icon-512.png" },
              "nsis": {
                "oneClick": false,
                "allowToChangeInstallationDirectory": true,
                "perMachine": false,
                "createDesktopShortcut": true,
                "createStartMenuShortcut": true,
                "shortcutName": "My Smart Assistant"
              },
              "artifactName": "My-Smart-Assistant-Setup.${ext}"
            }
          }
          JSON
          cat > preload.js <<'JS'
          const { contextBridge, ipcRenderer } = require('electron');
          contextBridge.exposeInMainWorld('msaDesktop', { installUpdate: (url) => ipcRenderer.invoke('msa-update', url), onUpdateProgress: (cb) => { ipcRenderer.removeAllListeners('msa-update-progress'); ipcRenderer.on('msa-update-progress', (_e, p) => { try { cb(p); } catch (e) {} }); } });
          JS
          node --check preload.js
          cat > main.js <<'JS'
          const { app, BrowserWindow, Tray, Menu, shell, nativeImage, ipcMain, net } = require('electron');
          const os = require('os');
          const path = require('path');
          const fs = require('fs');

          if (!app.requestSingleInstanceLock()) { app.quit(); }
          app.setAppUserModelId('com.mysmartassistant.app');

          let win = null, tray = null, quitting = false;
          const startHidden = process.argv.includes('--hidden');

          function showWindow() {
            if (!win) { createWindow(); return; }
            if (win.isMinimized()) win.restore();
            win.show();
            win.focus();
          }

          function createWindow() {
            win = new BrowserWindow({
              width: 1280, height: 820, minWidth: 360, minHeight: 500,
              show: !startHidden,
              autoHideMenuBar: true,
              backgroundColor: '#0f0f10',
              icon: path.join(__dirname, 'www/icons/icon-512.png'),
              webPreferences: { backgroundThrottling: false, contextIsolation: true, nodeIntegration: false, spellcheck: false, preload: path.join(__dirname, 'preload.js') }
            });
            win.setMenuBarVisibility(false);
            win.loadFile(path.join(__dirname, 'www/index.html'));
            win.webContents.setWindowOpenHandler(({ url }) => {
              if (/^(https?|mailto|tel):/i.test(url)) shell.openExternal(url);
              return { action: 'deny' };
            });
            win.webContents.on('will-navigate', (e, url) => {
              if (!url.startsWith('file:')) { e.preventDefault(); if (/^https?:/i.test(url)) shell.openExternal(url); }
            });
            win.on('close', (e) => { if (!quitting) { e.preventDefault(); win.hide(); } });
          }

          /* in-app update: download the installer from this project's GitHub Releases and start it */
          ipcMain.handle('msa-update', async (e, url) => {
            const send = (p) => { try { e.sender.send('msa-update-progress', p); } catch (x) {} };
            try {
              if (typeof url !== 'string' || !url.startsWith('https://github.com/mohamedashrafx55/My-Smart-Assistant/releases/download/') || !/\.exe$/i.test(url)) return { ok: false, error: 'bad url' };
              const res = await net.fetch(url);
              if (!res.ok) return { ok: false, error: 'http ' + res.status };
              const total = Number(res.headers.get('content-length')) || 0;
              const chunks = []; let got = 0, lastPct = -1;
              const reader = res.body.getReader();
              for (;;) {
                const { done, value } = await reader.read();
                if (done) break;
                chunks.push(Buffer.from(value)); got += value.length;
                if (total) { const pct = Math.min(100, Math.floor(got * 100 / total)); if (pct !== lastPct) { lastPct = pct; send({ percent: pct, got, total }); } }
              }
              const buf = Buffer.concat(chunks);
              if (buf.length < 1000000) return { ok: false, error: 'too small' };
              send({ percent: 100, got: buf.length, total: buf.length });
              const dl = app.getPath('downloads');
              const file = path.join(fs.existsSync(dl) ? dl : os.tmpdir(), 'My-Smart-Assistant-Setup-update.exe');
              fs.writeFileSync(file, buf);
              /* start detached; if Windows (Smart App Control / SmartScreen) refuses, report it and keep the app open */
              const started = await new Promise((resolve) => {
                let done = false; const fin = (v) => { if (!done) { done = true; resolve(v); } };
                try {
                  const cp = require('child_process').spawn(file, [], { detached: true, stdio: 'ignore' });
                  cp.on('error', (er) => fin({ err: String(er && er.message || er) }));
                  cp.on('exit', (code) => { if (code) fin({ err: 'exit ' + code }); });
                  cp.unref();
                  setTimeout(() => fin({ ok: true }), 2500);
                } catch (er) { fin({ err: String(er && er.message || er) }); }
              });
              if (started.err) { try { shell.showItemInFolder(file); } catch (x) {} return { ok: false, blocked: true, file, error: started.err }; }
              setTimeout(() => { quitting = true; app.quit(); }, 1500);
              return { ok: true };
            } catch (er) { return { ok: false, error: String(er && er.message || er) }; }
          });

          app.on('second-instance', showWindow);
          app.on('before-quit', () => { quitting = true; });
          app.on('window-all-closed', () => {});

          app.whenReady().then(() => {
            Menu.setApplicationMenu(null);
            createWindow();

            const flag = path.join(app.getPath('userData'), 'init.flag');
            if (!fs.existsSync(flag)) {
              app.setLoginItemSettings({ openAtLogin: true, args: ['--hidden'] });
              try { fs.writeFileSync(flag, '1'); } catch (e) {}
            }

            const icon = nativeImage.createFromPath(path.join(__dirname, 'www/icons/icon-192.png')).resize({ width: 16, height: 16 });
            tray = new Tray(icon);
            tray.setToolTip('My Smart Assistant');
            const buildMenu = () => Menu.buildFromTemplate([
              { label: 'فتح / Open', click: showWindow },
              { label: 'تشغيل مع الويندوز / Start with Windows', type: 'checkbox', checked: app.getLoginItemSettings().openAtLogin,
                click: (item) => { app.setLoginItemSettings({ openAtLogin: item.checked, args: ['--hidden'] }); } },
              { type: 'separator' },
              { label: 'خروج / Quit', click: () => { quitting = true; app.quit(); } }
            ]);
            tray.setContextMenu(buildMenu());
            tray.on('click', showWindow);
            tray.on('right-click', () => tray.setContextMenu(buildMenu()));
          });
          JS
          node --check main.js

      - name: Build installer
        working-directory: build
        run: |
          npm install --no-audit --no-fund --save-dev electron@33 electron-builder@25
          npx electron-builder --win nsis --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: My-Smart-Assistant-windows
          path: build/dist/My-Smart-Assistant-Setup.exe
          if-no-files-found: error

      - name: Publish GitHub Release (so the app can find updates)
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.run_number }}
        run: |
          printf 'Windows build %s\n\n%s\n' "$RUN" "$(git log -1 --pretty=%B)" > notes.md
          gh release create "windows-$RUN" build/dist/My-Smart-Assistant-Setup.exe --title "Windows build $RUN" --notes-file notes.md --target "$GITHUB_SHA"
