name: Build Windows EXE

# يشتغل يدويًا فقط: Actions > Build Windows EXE > Run workflow
on:
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare web files
        run: |
          mkdir -p build/www
          tar --exclude=./.git --exclude=./.github --exclude=./build --exclude='*.md' --exclude='*.zip' -cf - . | (cd build/www && tar -xf -)
          test -f build/www/index.html
          sed -i "s/n: 0/n: ${RUN}/; s/platform: 'web'/platform: 'windows'/" build/www/js/buildinfo.js
          grep -n 'MSA.build' build/www/js/buildinfo.js
        env:
          RUN: ${{ github.run_number }}

      - name: Create desktop app files
        working-directory: build
        run: |
          cat > package.json <<'JSON'
          {
            "name": "my-smart-assistant",
            "version": "1.0.0",
            "description": "My Smart Assistant",
            "author": "Mohamed Ashraf",
            "main": "main.js",
            "build": {
              "appId": "com.mysmartassistant.app",
              "productName": "My Smart Assistant",
              "directories": { "output": "dist" },
              "files": ["main.js", "preload.js", "www/**/*"],
              "win": { "target": "nsis", "icon": "www/icons/icon-512.png" },
              "nsis": {
                "oneClick": false,
                "allowToChangeInstallationDirectory": true,
                "perMachine": false,
                "createDesktopShortcut": true,
                "createStartMenuShortcut": true,
                "shortcutName": "My Smart Assistant"
              },
              "artifactName": "My-Smart-Assistant-Setup.${ext}"
            }
          }
          JSON
          cat > preload.js <<'JS'
          const { contextBridge, ipcRenderer } = require('electron');
          contextBridge.exposeInMainWorld('msaDesktop', { webview: true, onWebImage: (cb) => { ipcRenderer.removeAllListeners('msa-web-image'); ipcRenderer.on('msa-web-image', (_e, d) => { try { cb(d); } catch (e) {} }); }, installUpdate: (url) => ipcRenderer.invoke('msa-update', url), onUpdateProgress: (cb) => { ipcRenderer.removeAllListeners('msa-update-progress'); ipcRenderer.on('msa-update-progress', (_e, p) => { try { cb(p); } catch (e) {} }); } });
          JS
          node --check preload.js
          cat > main.js <<'JS'
          const { app, BrowserWindow, Tray, Menu, shell, nativeImage, ipcMain, net } = require('electron');
          const os = require('os');
          const path = require('path');
          const fs = require('fs');

          if (!app.requestSingleInstanceLock()) { app.quit(); }
          app.setAppUserModelId('com.mysmartassistant.app');

          let win = null, tray = null, quitting = false;
          const startHidden = process.argv.includes('--hidden');

          function showWindow() {
            if (!win) { createWindow(); return; }
            if (win.isMinimized()) win.restore();
            win.show();
            win.focus();
          }

          function createWindow() {
            win = new BrowserWindow({
              width: 1280, height: 820, minWidth: 360, minHeight: 500,
              show: !startHidden,
              autoHideMenuBar: true,
              backgroundColor: '#0f0f10',
              icon: path.join(__dirname, 'www/icons/icon-512.png'),
              webPreferences: { backgroundThrottling: false, contextIsolation: true, nodeIntegration: false, spellcheck: false, webviewTag: true, preload: path.join(__dirname, 'preload.js') }
            });
            win.setMenuBarVisibility(false);
            win.webContents.on('will-attach-webview', (e, webPreferences, params) => {
              delete webPreferences.preload; delete webPreferences.preloadURL;
              webPreferences.nodeIntegration = false; webPreferences.contextIsolation = true; webPreferences.webSecurity = true;
              params.partition = 'persist:msa-sites';
              if (params.src && params.src !== 'about:blank' && !/^https?:/i.test(params.src)) e.preventDefault();
            });
            win.loadFile(path.join(__dirname, 'www/index.html'));
            win.webContents.setWindowOpenHandler(({ url }) => {
              if (/^(https?|mailto|tel):/i.test(url)) shell.openExternal(url);
              return { action: 'deny' };
            });
            win.webContents.on('will-navigate', (e, url) => {
              if (!url.startsWith('file:')) { e.preventDefault(); if (/^https?:/i.test(url)) shell.openExternal(url); }
            });
            win.on('close', (e) => { if (!quitting) { e.preventDefault(); win.hide(); } });
          }

          /* embedded sites browser (Pinterest, Behance, Freepik …): hardened <webview> + right-click "Pin to my identity" */
          const AR = /^ar/i.test(app.getLocale());
          const L = (ar, en) => (AR ? ar : en);
          function sendBuf(contents, src, buf, mime) {
            if (!buf || !buf.length || buf.length > 15 * 1024 * 1024 || !win || win.isDestroyed()) return;
            let thumb = '';
            if (!/^https?:/i.test(src || '')) { try { const im = nativeImage.createFromBuffer(buf); const sz = im.getSize(); thumb = 'data:image/jpeg;base64,' + (sz.width > 480 ? im.resize({ width: 480 }) : im).toJPEG(72).toString('base64'); } catch (e) {} }
            win.webContents.send('msa-web-image', { src: /^https?:/i.test(src || '') ? src : '', thumb, page: contents.getURL(), mime: mime || '', b64: buf.toString('base64') });
          }
          async function sendWebImage(contents, src) {
            try {
              if (!win || win.isDestroyed()) return;
              if (/^data:image\//i.test(src || '')) { const m = /^data:([^;,]+)[^,]*;base64,(.*)$/i.exec(src); if (m) sendBuf(contents, src, Buffer.from(m[2], 'base64'), m[1]); return; }
              if (!/^https?:/i.test(src || '')) return;
              const res = await net.fetch(src, { headers: { Referer: contents.getURL() } });
              if (!res.ok) return;
              sendBuf(contents, src, Buffer.from(await res.arrayBuffer()), res.headers.get('content-type') || '');
            } catch (e) {}
          }
          /* find the picture under the cursor even when the site hides it: overlays, CSS backgrounds, <picture>, video posters, svg, canvas, blob: images */
          const PROBE = (x, y) => `(async function(x,y){
            function abs(u){try{return new URL(u,location.href).href}catch(e){return ''}}
            function bg(el){var b=getComputedStyle(el).backgroundImage||'';var m=/url\\(["']?(.*?)["']?\\)/.exec(b);return m?abs(m[1]):''}
            async function toData(u){try{if(!/^blob:/i.test(u))return u;var r=await fetch(u);var b=await r.blob();return await new Promise(function(ok){var f=new FileReader();f.onload=function(){ok(f.result)};f.readAsDataURL(b)})}catch(e){return ''}}
            var els=document.elementsFromPoint(x,y)||[];
            for(var i=0;i<els.length;i++){var el=els[i],u='';
              if(el.tagName==='IMG')u=el.currentSrc||el.src;
              else if(el.tagName==='VIDEO')u=el.poster||'';
              else if(el.tagName==='IMAGE'||el.tagName==='image')u=el.getAttribute('href')||el.getAttribute('xlink:href')||'';
              else if(el.tagName==='CANVAS'){try{u=el.toDataURL('image/png')}catch(e){u=''}}
              else if(el.tagName==='PICTURE'){var im=el.querySelector('img');u=im?(im.currentSrc||im.src):''}
              if(!u)u=bg(el);
              if(!u){var near=el.querySelector&&el.querySelector('img');if(near&&near.getBoundingClientRect){var r=near.getBoundingClientRect();if(x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom)u=near.currentSrc||near.src}}
              if(u&&!/^(javascript|about):/i.test(u)){u=abs(u)||u;u=await toData(u);if(u)return u}
            }
            return ''})(${Math.round(x)},${Math.round(y)})`;
          async function pageShot(contents) {
            try { const im = await contents.capturePage(); if (win && !win.isDestroyed()) sendBuf(contents, '', im.toPNG(), 'image/png'); } catch (e) {}
          }
          app.on('web-contents-created', (_e, contents) => {
            if (contents.getType() === 'webview') {
              /* look like normal Chrome: Google and some sites refuse sign-in from a browser that says "Electron" */
              try { contents.setUserAgent(contents.getUserAgent().replace(/\sElectron\/\S+/i, '').replace(/\smy-smart-assistant\/\S+/i, '')); } catch (e) {}
              /* sign-in popups ("Continue with Google/Apple/Facebook") must be real child windows so the site can talk back to them; everything else stays in the same view */
              contents.setWindowOpenHandler(({ url }) => {
                if (/^https:\/\/([a-z0-9-]+\.)*(google|apple|facebook|microsoft|live|adobe|github)\.(com|net)\//i.test(url)) return { action: 'allow', overrideBrowserWindowOptions: { width: 520, height: 700, autoHideMenuBar: true, webPreferences: { nodeIntegration: false, contextIsolation: true } } };
                if (/^https?:/i.test(url)) contents.loadURL(url);
                return { action: 'deny' };
              });
              contents.on('context-menu', async (_ev, params) => {
                const items = [];
                let img = (params.mediaType === 'image' && params.srcURL) ? params.srcURL : '';
                if (!img) { try { img = await contents.executeJavaScript(PROBE(params.x, params.y)); } catch (e) { img = ''; } }
                if (img) {
                  items.push({ label: L('تثبيت في هويتي', 'Pin to my identity'), click: () => sendWebImage(contents, img) });
                  if (/^https?:/i.test(img)) {
                    items.push({ label: L('نسخ الصورة', 'Copy image'), click: () => { if (params.mediaType === 'image') contents.copyImageAt(params.x, params.y); else net.fetch(img, { headers: { Referer: contents.getURL() } }).then(r => r.arrayBuffer()).then(b => require('electron').clipboard.writeImage(nativeImage.createFromBuffer(Buffer.from(b)))).catch(() => {}); } });
                    items.push({ label: L('نسخ رابط الصورة', 'Copy image address'), click: () => require('electron').clipboard.writeText(img) });
                  }
                  items.push({ type: 'separator' });
                } else {
                  items.push({ label: L('تثبيت لقطة من الصفحة في هويتي', 'Pin a screenshot of this page'), click: () => pageShot(contents) });
                  items.push({ type: 'separator' });
                }
                if (params.linkURL && /^https?:/i.test(params.linkURL)) items.push({ label: L('نسخ رابط الصفحة', 'Copy link address'), click: () => require('electron').clipboard.writeText(params.linkURL) });
                if (contents.navigationHistory ? contents.navigationHistory.canGoBack() : contents.canGoBack()) items.push({ label: L('رجوع', 'Back'), click: () => (contents.navigationHistory ? contents.navigationHistory.goBack() : contents.goBack()) });
                items.push({ label: L('تحديث', 'Reload'), click: () => contents.reload() });
                items.push({ label: L('فتح في المتصفح', 'Open in browser'), click: () => { const u = contents.getURL(); if (/^https?:/i.test(u)) shell.openExternal(u); } });
                const menu = Menu.buildFromTemplate(items);
                global.__msaWebMenu = menu;
                menu.popup();
              });
            }
          });

          /* in-app update: download the installer from this project's GitHub Releases and start it */
          ipcMain.handle('msa-update', async (e, url) => {
            const send = (p) => { try { e.sender.send('msa-update-progress', p); } catch (x) {} };
            try {
              if (typeof url !== 'string' || !url.startsWith('https://github.com/mohamedashrafx55/My-Smart-Assistant/releases/download/') || !/\.exe$/i.test(url)) return { ok: false, error: 'bad url' };
              const res = await net.fetch(url);
              if (!res.ok) return { ok: false, error: 'http ' + res.status };
              const total = Number(res.headers.get('content-length')) || 0;
              const chunks = []; let got = 0, lastPct = -1;
              const reader = res.body.getReader();
              for (;;) {
                const { done, value } = await reader.read();
                if (done) break;
                chunks.push(Buffer.from(value)); got += value.length;
                if (total) { const pct = Math.min(100, Math.floor(got * 100 / total)); if (pct !== lastPct) { lastPct = pct; send({ percent: pct, got, total }); } }
              }
              const buf = Buffer.concat(chunks);
              if (buf.length < 1000000) return { ok: false, error: 'too small' };
              send({ percent: 100, got: buf.length, total: buf.length });
              const dl = app.getPath('downloads');
              const file = path.join(fs.existsSync(dl) ? dl : os.tmpdir(), 'My-Smart-Assistant-Setup-update.exe');
              fs.writeFileSync(file, buf);
              /* start detached; if Windows (Smart App Control / SmartScreen) refuses, report it and keep the app open */
              const started = await new Promise((resolve) => {
                let done = false; const fin = (v) => { if (!done) { done = true; resolve(v); } };
                try {
                  const cp = require('child_process').spawn(file, [], { detached: true, stdio: 'ignore' });
                  cp.on('error', (er) => fin({ err: String(er && er.message || er) }));
                  cp.on('exit', (code) => { if (code) fin({ err: 'exit ' + code }); });
                  cp.unref();
                  setTimeout(() => fin({ ok: true }), 2500);
                } catch (er) { fin({ err: String(er && er.message || er) }); }
              });
              if (started.err) { try { shell.showItemInFolder(file); } catch (x) {} return { ok: false, blocked: true, file, error: started.err }; }
              setTimeout(() => { quitting = true; app.quit(); }, 1500);
              return { ok: true };
            } catch (er) { return { ok: false, error: String(er && er.message || er) }; }
          });

          app.on('second-instance', showWindow);
          app.on('before-quit', () => { quitting = true; });
          app.on('window-all-closed', () => {});

          app.whenReady().then(() => {
            Menu.setApplicationMenu(null);
            /* YouTube embeds fail with "Error 153" when the page has no web origin (file://). Send a normal https Referer for the embed frames only. */
            try {
              require('electron').session.defaultSession.webRequest.onBeforeSendHeaders({ urls: ['https://www.youtube-nocookie.com/*', 'https://www.youtube.com/embed/*'] }, (details, cb) => {
                const h = details.requestHeaders; h['Referer'] = 'https://mohamedashrafx55.github.io/My-Smart-Assistant/'; cb({ requestHeaders: h });
              });
            } catch (e) {}
            createWindow();

            const flag = path.join(app.getPath('userData'), 'init.flag');
            if (!fs.existsSync(flag)) {
              app.setLoginItemSettings({ openAtLogin: true, args: ['--hidden'] });
              try { fs.writeFileSync(flag, '1'); } catch (e) {}
            }

            const icon = nativeImage.createFromPath(path.join(__dirname, 'www/icons/icon-192.png')).resize({ width: 16, height: 16 });
            tray = new Tray(icon);
            tray.setToolTip('My Smart Assistant');
            const buildMenu = () => Menu.buildFromTemplate([
              { label: 'فتح / Open', click: showWindow },
              { label: 'تشغيل مع الويندوز / Start with Windows', type: 'checkbox', checked: app.getLoginItemSettings().openAtLogin,
                click: (item) => { app.setLoginItemSettings({ openAtLogin: item.checked, args: ['--hidden'] }); } },
              { type: 'separator' },
              { label: 'خروج / Quit', click: () => { quitting = true; app.quit(); } }
            ]);
            tray.setContextMenu(buildMenu());
            tray.on('click', showWindow);
            tray.on('right-click', () => tray.setContextMenu(buildMenu()));
          });
          JS
          node --check main.js

      - name: Build installer
        working-directory: build
        run: |
          npm install --no-audit --no-fund --save-dev electron@33 electron-builder@25
          npx electron-builder --win nsis --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: My-Smart-Assistant-windows
          path: build/dist/My-Smart-Assistant-Setup.exe
          if-no-files-found: error

      - name: Publish GitHub Release (so the app can find updates)
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.run_number }}
        run: |
          printf 'Windows build %s\n\n%s\n' "$RUN" "$(git log -1 --pretty=%B)" > notes.md
          gh release create "windows-$RUN" build/dist/My-Smart-Assistant-Setup.exe --title "Windows build $RUN" --notes-file notes.md --target "$GITHUB_SHA"
