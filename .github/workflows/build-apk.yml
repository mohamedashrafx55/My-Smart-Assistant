name: Build Android APK

# يشتغل يدويًا فقط: Actions > Build Android APK > Run workflow
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web files
        run: |
          mkdir -p build/www
          rsync -a --exclude='.git' --exclude='.github' --exclude='build' --exclude='*.md' --exclude='*.zip' ./ build/www/
          test -f build/www/index.html

      - name: Create Capacitor project
        working-directory: build
        run: |
          cat > capacitor.config.json <<'JSON'
          {"appId":"com.mysmartassistant.app","appName":"My Smart Assistant","webDir":"www","server":{"androidScheme":"https"}}
          JSON
          npm init -y
          npm install --no-audit --no-fund --legacy-peer-deps @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/app@6 @capacitor/browser@6 @capacitor/filesystem@6 @capacitor/share@6 @capacitor/local-notifications@6
          npm install --no-audit --no-fund --legacy-peer-deps @aparajita/capacitor-biometric-auth@8 || echo "biometric plugin skipped"
          npx cap add android

      - name: Permissions, version, app icon
        working-directory: build
        run: |
          python3 - <<'PY'
          import re
          p='android/app/src/main/AndroidManifest.xml'
          s=open(p,encoding='utf-8').read()
          add=''
          for perm in ['POST_NOTIFICATIONS','SCHEDULE_EXACT_ALARM','RECEIVE_BOOT_COMPLETED','USE_BIOMETRIC','VIBRATE']:
              if 'android.permission.'+perm not in s:
                  add+='    <uses-permission android:name="android.permission.%s"/>\n'%perm
          s=s.replace('<application',add+'    <application',1)
          open(p,'w',encoding='utf-8').write(s)
          g='android/app/build.gradle'
          t=open(g,encoding='utf-8').read()
          import os
          t=re.sub(r'versionCode\s+\d+','versionCode '+os.environ.get('RUN','1'),t,1)
          open(g,'w',encoding='utf-8').write(t)
          PY
          mkdir -p assets
          convert www/icons/icon-512.png -resize 1024x1024 assets/icon-only.png || true
          cp assets/icon-only.png assets/icon-foreground.png || true
          convert -size 1024x1024 xc:'#0f0f10' assets/icon-background.png || true
          npm install --no-audit --no-fund --legacy-peer-deps @capacitor/assets || true
          npx capacitor-assets generate --android || echo "icon generation skipped - default icon will be used"
        env:
          RUN: ${{ github.run_number }}

      - name: Fixed signing key (so updates install over the old app)
        run: |
          mkdir -p ~/.android
          echo "$B64" | base64 -d > ~/.android/debug.keystore
        env:
          B64: 

      - name: Build APK
        working-directory: build
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: My-Smart-Assistant-apk
          path: build/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
