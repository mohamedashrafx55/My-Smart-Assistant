name: Build Android APK

# يشتغل يدويًا فقط: Actions > Build Android APK > Run workflow
on:
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web files
        run: |
          mkdir -p build/www
          rsync -a --exclude='.git' --exclude='.github' --exclude='build' --exclude='*.md' --exclude='*.zip' ./ build/www/
          test -f build/www/index.html
          sed -i "s/n: 0/n: ${RUN}/; s/platform: 'web'/platform: 'android'/" build/www/js/buildinfo.js
          grep -n 'MSA.build' build/www/js/buildinfo.js
        env:
          RUN: ${{ github.run_number }}

      - name: Create Capacitor project
        working-directory: build
        run: |
          cat > capacitor.config.json <<'JSON'
          {"appId":"com.mysmartassistant.app","appName":"My Smart Assistant","webDir":"www","server":{"androidScheme":"https"}}
          JSON
          npm init -y
          npm install --no-audit --no-fund --legacy-peer-deps @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/app@6 @capacitor/browser@6 @capacitor/filesystem@6 @capacitor/share@6 @capacitor/local-notifications@6 @capacitor/clipboard@6 @capacitor/app-launcher@6
          npm install --no-audit --no-fund --legacy-peer-deps @aparajita/capacitor-biometric-auth@8 || echo "biometric plugin skipped"
          npx cap add android

      - name: Permissions, version, app icon
        working-directory: build
        run: |
          python3 - <<'PY'
          import re
          p='android/app/src/main/AndroidManifest.xml'
          s=open(p,encoding='utf-8').read()
          add=''
          for perm in ['POST_NOTIFICATIONS','SCHEDULE_EXACT_ALARM','RECEIVE_BOOT_COMPLETED','USE_BIOMETRIC','VIBRATE','REQUEST_INSTALL_PACKAGES','CAMERA','RECORD_AUDIO','MODIFY_AUDIO_SETTINGS','ACCESS_FINE_LOCATION','ACCESS_COARSE_LOCATION','READ_CONTACTS','READ_MEDIA_IMAGES','READ_MEDIA_VIDEO','READ_MEDIA_AUDIO','READ_EXTERNAL_STORAGE']:
              if 'android.permission.'+perm not in s:
                  add+='    <uses-permission android:name="android.permission.%s"/>\n'%perm
          for feat in ['camera','camera.autofocus','microphone','location']:
              if 'android.hardware.'+feat not in s:
                  add+='    <uses-feature android:name="android.hardware.%s" android:required="false"/>\n'%feat
          s=s.replace('<application',add+'    <application',1)
          open(p,'w',encoding='utf-8').write(s)
          g='android/app/build.gradle'
          t=open(g,encoding='utf-8').read()
          import os
          t=re.sub(r'versionCode\s+\d+','versionCode '+os.environ.get('RUN','1'),t,1)
          open(g,'w',encoding='utf-8').write(t)
          PY
          python3 -c "import PIL" 2>/dev/null || pip install --break-system-packages pillow || pip install pillow
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          import os
          res = 'android/app/src/main/res'
          src = '../.github/android-icons'
          fg = Image.open(src + '/icon-foreground.png').convert('RGBA')
          full = Image.open(src + '/icon-only.png').convert('RGBA')
          dens = {'mdpi': (48, 108), 'hdpi': (72, 162), 'xhdpi': (96, 216), 'xxhdpi': (144, 324), 'xxxhdpi': (192, 432)}
          for d, (legacy, adaptive) in dens.items():
              p = '%s/mipmap-%s' % (res, d)
              os.makedirs(p, exist_ok=True)
              fg.resize((adaptive, adaptive), Image.LANCZOS).save(p + '/ic_launcher_foreground.png')
              sq = full.resize((legacy, legacy), Image.LANCZOS)
              m = Image.new('L', (legacy, legacy), 0)
              ImageDraw.Draw(m).rounded_rectangle((0, 0, legacy - 1, legacy - 1), radius=int(legacy * 0.22), fill=255)
              a = Image.new('RGBA', (legacy, legacy), (0, 0, 0, 0)); a.paste(sq, (0, 0), m); a.save(p + '/ic_launcher.png')
              m2 = Image.new('L', (legacy, legacy), 0)
              ImageDraw.Draw(m2).ellipse((0, 0, legacy - 1, legacy - 1), fill=255)
              b = Image.new('RGBA', (legacy, legacy), (0, 0, 0, 0)); b.paste(sq, (0, 0), m2); b.save(p + '/ic_launcher_round.png')
          os.makedirs(res + '/values', exist_ok=True)
          open(res + '/values/ic_launcher_background.xml', 'w').write('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#222222</color>\n</resources>\n')
          print('icons written')
          PY
        env:
          RUN: ${{ github.run_number }}

      - name: In-app updater plugin (download the APK inside the app and open the installer)
        working-directory: build
        run: |
          d=android/app/src/main/java/com/mysmartassistant/app
          test -f $d/MainActivity.java
          mkdir -p android/app/src/main/res/xml
          cat > android/app/src/main/res/xml/msa_update_paths.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <cache-path name="updates" path="updates/" />
          </paths>
          XML
          cat > $d/MsaFileProvider.java <<'JAVA'
          package com.mysmartassistant.app;

          import androidx.core.content.FileProvider;

          public class MsaFileProvider extends FileProvider {
          }
          JAVA
          cat > $d/MainActivity.java <<'JAVA'
          package com.mysmartassistant.app;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(ApkInstaller.class);
                  registerPlugin(MsaPerms.class);
                  super.onCreate(savedInstanceState);
              }
          }
          JAVA
          cat > $d/ApkInstaller.java <<'JAVA'
          package com.mysmartassistant.app;

          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.provider.Settings;
          import androidx.core.content.FileProvider;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;

          @CapacitorPlugin(name = "ApkInstaller")
          public class ApkInstaller extends Plugin {
              private volatile boolean busy = false;

              @PluginMethod
              public void canInstall(PluginCall call) {
                  boolean ok = Build.VERSION.SDK_INT < 26 || getContext().getPackageManager().canRequestPackageInstalls();
                  JSObject r = new JSObject();
                  r.put("allowed", ok);
                  call.resolve(r);
              }

              @PluginMethod
              public void openSettings(PluginCall call) {
                  try {
                      Intent i = new Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES, Uri.parse("package:" + getContext().getPackageName()));
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      getContext().startActivity(i);
                      call.resolve();
                  } catch (Exception e) {
                      call.reject(String.valueOf(e.getMessage()));
                  }
              }

              @PluginMethod
              public void download(final PluginCall call) {
                  final String url = call.getString("url");
                  if (url == null || !url.startsWith("https://github.com/mohamedashrafx55/My-Smart-Assistant/releases/download/") || !url.toLowerCase().endsWith(".apk")) {
                      call.reject("bad url");
                      return;
                  }
                  if (busy) {
                      call.reject("busy");
                      return;
                  }
                  busy = true;
                  new Thread(new Runnable() {
                      @Override
                      public void run() {
                          HttpURLConnection c = null;
                          try {
                              File dir = new File(getContext().getCacheDir(), "updates");
                              dir.mkdirs();
                              File out = new File(dir, "update.apk");
                              if (out.exists()) out.delete();
                              c = (HttpURLConnection) new URL(url).openConnection();
                              c.setConnectTimeout(20000);
                              c.setReadTimeout(30000);
                              c.setInstanceFollowRedirects(true);
                              c.setRequestProperty("User-Agent", "MySmartAssistant");
                              int code = c.getResponseCode();
                              if (code != 200) {
                                  call.reject("http " + code);
                                  return;
                              }
                              int total = c.getContentLength();
                              InputStream in = c.getInputStream();
                              OutputStream os = new FileOutputStream(out);
                              byte[] buf = new byte[32768];
                              long done = 0;
                              int lastPct = -1;
                              int n;
                              while ((n = in.read(buf)) != -1) {
                                  os.write(buf, 0, n);
                                  done += n;
                                  if (total > 0) {
                                      int pct = (int) (done * 100 / total);
                                      if (pct != lastPct) {
                                          lastPct = pct;
                                          JSObject p = new JSObject();
                                          p.put("percent", pct);
                                          p.put("bytes", done);
                                          p.put("total", total);
                                          notifyListeners("progress", p);
                                      }
                                  }
                              }
                              os.close();
                              in.close();
                              if (out.length() < 1000000) {
                                  out.delete();
                                  call.reject("too small");
                                  return;
                              }
                              JSObject r = new JSObject();
                              r.put("path", out.getAbsolutePath());
                              call.resolve(r);
                          } catch (Exception e) {
                              call.reject(String.valueOf(e.getMessage()));
                          } finally {
                              busy = false;
                              if (c != null) c.disconnect();
                          }
                      }
                  }).start();
              }

              @PluginMethod
              public void install(PluginCall call) {
                  try {
                      String path = call.getString("path");
                      File f = new File(path == null ? "" : path);
                      File base = new File(getContext().getCacheDir(), "updates");
                      if (!f.exists() || !f.getCanonicalPath().startsWith(base.getCanonicalPath())) {
                          call.reject("bad path");
                          return;
                      }
                      Uri uri = FileProvider.getUriForFile(getContext(), getContext().getPackageName() + ".msaupdate", f);
                      Intent i = new Intent(Intent.ACTION_VIEW);
                      i.setDataAndType(uri, "application/vnd.android.package-archive");
                      i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_ACTIVITY_NEW_TASK);
                      getContext().startActivity(i);
                      call.resolve();
                  } catch (Exception e) {
                      call.reject(String.valueOf(e.getMessage()));
                  }
              }
          }
          JAVA
          cat > $d/MsaPerms.java <<'JAVA'
          package com.mysmartassistant.app;

          import android.Manifest;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import android.content.Intent;
          import android.database.Cursor;
          import android.net.Uri;
          import android.os.Build;
          import android.provider.ContactsContract;
          import android.provider.Settings;
          import androidx.activity.result.ActivityResult;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.PermissionState;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.ActivityCallback;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.getcapacitor.annotation.Permission;
          import com.getcapacitor.annotation.PermissionCallback;

          @CapacitorPlugin(name = "MsaPerms", permissions = {
              @Permission(alias = "contacts", strings = { Manifest.permission.READ_CONTACTS }),
              @Permission(alias = "camera", strings = { Manifest.permission.CAMERA }),
              @Permission(alias = "microphone", strings = { Manifest.permission.RECORD_AUDIO }),
              @Permission(alias = "location", strings = { Manifest.permission.ACCESS_COARSE_LOCATION, Manifest.permission.ACCESS_FINE_LOCATION }),
              @Permission(alias = "media", strings = { "android.permission.READ_MEDIA_IMAGES", "android.permission.READ_MEDIA_VIDEO", "android.permission.READ_MEDIA_AUDIO" }),
              @Permission(alias = "storage", strings = { Manifest.permission.READ_EXTERNAL_STORAGE })
          })
          public class MsaPerms extends Plugin {
              private String alias(String name) {
                  if ("files".equals(name)) return Build.VERSION.SDK_INT >= 33 ? "media" : "storage";
                  return name;
              }

              private String stateOf(String a) {
                  PermissionState s = getPermissionState(a);
                  if (s == PermissionState.GRANTED) return "granted";
                  if (s == PermissionState.DENIED) return "denied";
                  return "prompt";
              }

              @PluginMethod
              public void permState(PluginCall call) {
                  String a = alias(call.getString("name", ""));
                  JSObject r = new JSObject();
                  r.put("state", stateOf(a));
                  call.resolve(r);
              }

              @PluginMethod
              public void permAsk(PluginCall call) {
                  String a = alias(call.getString("name", ""));
                  if (getPermissionState(a) == PermissionState.GRANTED) {
                      JSObject r = new JSObject();
                      r.put("state", "granted");
                      call.resolve(r);
                      return;
                  }
                  requestPermissionForAlias(a, call, "permCb");
              }

              @PermissionCallback
              private void permCb(PluginCall call) {
                  String a = alias(call.getString("name", ""));
                  JSObject r = new JSObject();
                  r.put("state", stateOf(a));
                  call.resolve(r);
              }

              @PluginMethod
              public void openAppSettings(PluginCall call) {
                  try {
                      Intent i = new Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS, Uri.parse("package:" + getContext().getPackageName()));
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      getContext().startActivity(i);
                      call.resolve();
                  } catch (Exception e) {
                      call.reject(String.valueOf(e.getMessage()));
                  }
              }

              @PluginMethod
              public void pickContact(PluginCall call) {
                  Intent i = new Intent(Intent.ACTION_PICK, ContactsContract.CommonDataKinds.Phone.CONTENT_URI);
                  startActivityForResult(call, i, "pickCb");
              }

              @ActivityCallback
              private void pickCb(PluginCall call, ActivityResult result) {
                  JSObject r = new JSObject();
                  if (call == null) return;
                  if (result.getResultCode() != android.app.Activity.RESULT_OK || result.getData() == null || result.getData().getData() == null) {
                      r.put("cancelled", true);
                      call.resolve(r);
                      return;
                  }
                  Cursor c = null;
                  try {
                      c = getContext().getContentResolver().query(result.getData().getData(),
                          new String[] { ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME, ContactsContract.CommonDataKinds.Phone.NUMBER }, null, null, null);
                      if (c != null && c.moveToFirst()) {
                          r.put("name", c.getString(0));
                          r.put("phone", c.getString(1));
                      }
                      call.resolve(r);
                  } catch (Exception e) {
                      call.reject(String.valueOf(e.getMessage()));
                  } finally {
                      if (c != null) c.close();
                  }
              }

              @PluginMethod
              public void copyText(PluginCall call) {
                  try {
                      ClipboardManager cm = (ClipboardManager) getContext().getSystemService(Context.CLIPBOARD_SERVICE);
                      cm.setPrimaryClip(ClipData.newPlainText("msa", call.getString("value", "")));
                      call.resolve();
                  } catch (Exception e) {
                      call.reject(String.valueOf(e.getMessage()));
                  }
              }

              @PluginMethod
              public void readClipboard(PluginCall call) {
                  JSObject r = new JSObject();
                  String v = "";
                  try {
                      ClipboardManager cm = (ClipboardManager) getContext().getSystemService(Context.CLIPBOARD_SERVICE);
                      ClipData cd = cm.getPrimaryClip();
                      if (cd != null && cd.getItemCount() > 0) {
                          CharSequence t = cd.getItemAt(0).coerceToText(getContext());
                          if (t != null) v = t.toString();
                      }
                  } catch (Exception e) { }
                  r.put("value", v);
                  call.resolve(r);
              }
          }
          JAVA
          python3 - <<'PY'
          p='android/app/src/main/AndroidManifest.xml'
          s=open(p,encoding='utf-8').read()
          prov='    <provider android:name="com.mysmartassistant.app.MsaFileProvider" android:authorities="${applicationId}.msaupdate" android:exported="false" android:grantUriPermissions="true">\n        <meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/msa_update_paths"/>\n    </provider>\n'
          if 'msaupdate' not in s:
              assert '</application>' in s
              s=s.replace('</application>',prov+'</application>',1)
          open(p,'w',encoding='utf-8').write(s)
          PY
          grep -n "msaupdate\|REQUEST_INSTALL" android/app/src/main/AndroidManifest.xml

      - name: Notification sounds (5 tones into res/raw)
        working-directory: build
        run: |
          python3 - <<'PY'
          import json, math, struct, wave, os, random
          spec = json.load(open('../.github/android-sounds.json'))
          out = 'android/app/src/main/res/raw'; os.makedirs(out, exist_ok=True)
          SR = 22050
          def osc(w, ph):
              x = ph % 1.0
              if w == 'square': return 1.0 if x < .5 else -1.0
              if w == 'triangle': return 4 * abs(x - .5) - 1
              return math.sin(2 * math.pi * x)
          for sp in spec:
              total = max(n['t'] + n['d'] for n in sp['n']) + .1
              buf = [0.0] * int(SR * total)
              for n in sp['n']:
                  s0 = int(n['t'] * SR); L = int(n['d'] * SR); ph = 0.0
                  f1, f2 = n['f'], n.get('f2') or n['f']
                  for i in range(L):
                      r = i / L; f = f1 * (f2 / f1) ** r; ph += f / SR
                      att = min(1.0, i / (SR * .015)); dec = math.exp(-5 * r)
                      if s0 + i < len(buf): buf[s0 + i] += osc(n['w'], ph) * n['g'] * att * dec
              m = max(1e-6, max(abs(v) for v in buf)); k = min(1.0, .9 / m)
              wf = wave.open(out + '/msa_' + sp['id'] + '.wav', 'wb'); wf.setnchannels(1); wf.setsampwidth(2); wf.setframerate(SR)
              wf.writeframes(b''.join(struct.pack('<h', int(max(-1, min(1, v * k)) * 32000)) for v in buf)); wf.close()
          print('sounds written:', os.listdir(out))
          PY

      - name: Fixed signing key (so updates install over the old app)
        working-directory: build
        run: |
          echo "$B64" | base64 -d > android/app/msa.keystore
          python3 - <<'PY'
          import re
          g='android/app/build.gradle'
          t=open(g,encoding='utf-8').read()
          blk = "signingConfigs {\n        debug {\n            storeFile file('msa.keystore')\n            storePassword 'android'\n            keyAlias 'androiddebugkey'\n            keyPassword 'android'\n        }\n    }\n    "
          assert 'msa.keystore' not in t
          t, n = re.subn(r'(\nandroid\s*\{\s*\n)', lambda m: m.group(1) + '    ' + blk, t, count=1)
          assert n == 1, 'android block not found'
          open(g,'w',encoding='utf-8').write(t)
          PY
          grep -n -A8 "signingConfigs" android/app/build.gradle | head -14
        env:
          B64: 

      - name: Build APK
        working-directory: build
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify the APK is signed with the fixed key
        run: |
          got=$(keytool -printcert -jarfile build/android/app/build/outputs/apk/debug/app-debug.apk | grep "SHA1:" | head -1 | awk '{print $2}')
          echo "APK signing SHA1: $got"
          test "$got" = "9B:C8:BA:DD:1E:07:68:06:1B:1C:22:DC:76:A3:99:4F:27:B5:53:46" || { echo "Signing key differs from the fixed key"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: My-Smart-Assistant-apk
          path: build/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish GitHub Release (so the app can find updates)
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.run_number }}
        run: |
          cp build/android/app/build/outputs/apk/debug/app-debug.apk My-Smart-Assistant.apk
          printf 'Android build %s\n\n%s\n' "$RUN" "$(git log -1 --pretty=%B)" > notes.md
          gh release create "android-$RUN" My-Smart-Assistant.apk --title "Android build $RUN" --notes-file notes.md --target "$GITHUB_SHA"
